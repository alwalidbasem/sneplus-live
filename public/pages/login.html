<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — Sneplus Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="/js/tailwind-config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="bg-ink text-text font-sans antialiased">

<main class="max-w-md mx-auto px-5 py-16">
  <a href="/" class="flex items-center justify-center gap-2 mb-10">
    <svg width="34" height="34" viewBox="0 0 30 30" fill="none">
      <circle cx="15" cy="15" r="15" fill="#FF2D6B"/>
      <path d="M13 8 L9 16 H13.5 L12 22 L21 12 H15.5 L17.5 8 Z" fill="#0C0C0E"/>
    </svg>
    <span class="font-display text-xl tracking-tight">SNEPLUS LIVE</span>
  </a>

  <div class="bg-surface border border-line rounded-2xl p-6 sm:p-8">
    <div class="flex justify-center mb-6">
      <div class="inline-flex bg-ink border border-line rounded-full p-1 text-sm font-semibold">
        <button id="tabLogin" class="px-4 py-1.5 rounded-full bg-hype transition">Log in</button>
        <button id="tabRegister" class="px-4 py-1.5 rounded-full transition">Register</button>
      </div>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="text-xs font-semibold text-muted">Email</label>
        <input id="loginEmail" type="email" required class="w-full mt-1 rounded-xl px-3.5 py-2.5 text-sm" placeholder="you@example.com" />
      </div>
      <div>
        <label class="text-xs font-semibold text-muted">Password</label>
        <input id="loginPassword" type="password" required class="w-full mt-1 rounded-xl px-3.5 py-2.5 text-sm" placeholder="••••••••" />
      </div>
      <p id="authError" class="hidden text-xs text-hype"></p>
      <button id="loginSubmitBtn" type="submit" class="w-full py-3 rounded-full bg-hype hover:bg-hypedark font-bold text-sm transition disabled:opacity-50">Log in</button>
      <p class="text-[11px] text-muted text-center leading-relaxed">Demo: admin@sneplus.live / Admin123!<br/>Buyer: ali@ex.com / Buyer123!</p>
    </form>

    <form id="registerForm" class="space-y-4 hidden">
      <div>
        <label class="text-xs font-semibold text-muted">Name</label>
        <input id="regName" type="text" required class="w-full mt-1 rounded-xl px-3.5 py-2.5 text-sm" />
      </div>
      <div>
        <label class="text-xs font-semibold text-muted">Email</label>
        <input id="regEmail" type="email" required class="w-full mt-1 rounded-xl px-3.5 py-2.5 text-sm" />
      </div>
      <div>
        <label class="text-xs font-semibold text-muted">Password (min 8 chars)</label>
        <input id="regPassword" type="password" required minlength="8" class="w-full mt-1 rounded-xl px-3.5 py-2.5 text-sm" />
      </div>
      <p id="regError" class="hidden text-xs text-hype"></p>
      <button id="registerSubmitBtn" type="submit" class="w-full py-3 rounded-full bg-hype hover:bg-hypedark font-bold text-sm transition disabled:opacity-50">Create account</button>
    </form>
  </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/js/utils/toast.js"></script>
<script src="/js/api/api.js"></script>
<script src="/js/api/auth.api.js"></script>
<script src="/js/app.js"></script>
<script>
  $(async () => {
    await App.init();
    const params = new URLSearchParams(location.search);
    const next = params.get('next') || '/admin';
    const safeNext = next.startsWith('/') && !next.startsWith('//') ? next : '/admin';
    if (App.user) location.href = safeNext;

    const setTab = (tab) => {
      const login = tab === 'login';
      $('#loginForm, #tabLogin').toggleClass('hidden', !login);
      $('#registerForm').toggleClass('hidden', login);
      $('#tabLogin').toggleClass('bg-hype', login);
      $('#tabRegister').toggleClass('bg-hype', !login);
    };
    $('#tabLogin').on('click', () => setTab('login'));
    $('#tabRegister').on('click', () => setTab('register'));

    const showErr = (sel, msg) => { $(sel).text(msg).removeClass('hidden'); };

    $('#loginForm').on('submit', async (e) => {
      e.preventDefault();
      $('#authError').addClass('hidden');
      $('#loginSubmitBtn').prop('disabled', true).text('Logging in...');
      try {
        await AuthAPI.login($('#loginEmail').val().trim(), $('#loginPassword').val());
        location.href = safeNext;
      } catch (xhr) {
        showErr('#authError', API.errorText(xhr));
        $('#loginSubmitBtn').prop('disabled', false).text('Log in');
      }
    });

    $('#registerForm').on('submit', async (e) => {
      e.preventDefault();
      $('#regError').addClass('hidden');
      $('#registerSubmitBtn').prop('disabled', true).text('Creating...');
      try {
        await AuthAPI.register($('#regName').val().trim(), $('#regEmail').val().trim(), $('#regPassword').val());
        location.href = safeNext;
      } catch (xhr) {
        showErr('#regError', API.errorText(xhr));
        $('#registerSubmitBtn').prop('disabled', false).text('Create account');
      }
    });
  });
</script>
</body>
</html>
