<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Waitlist — Sneplus Live</title>
  <script src="/js/lang-boot.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://api.fontshare.com/v2/css?f[]=switzer@500,600,700&f[]=satoshi@500,600,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="/js/tailwind-config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="bg-ink text-text font-sans antialiased">

<div data-component="navbar"></div>

<main class="max-w-6xl mx-auto">
  <section class="px-5 py-14">
    <div class="max-w-lg mx-auto">
      <div class="flex justify-center mb-8">
        <div class="inline-flex bg-surface border border-line rounded-full p-1 text-sm font-semibold">
          <button id="wlLangEnBtn" class="px-4 py-1.5 rounded-full transition">English</button>
          <button id="wlLangArBtn" class="px-4 py-1.5 rounded-full transition">العربية</button>
        </div>
      </div>

      <div id="wlSuccess" class="hidden text-center bg-surface border border-line rounded-2xl p-8">
        <div class="text-4xl mb-3">✅</div>
        <p id="wlSuccessMsg" class="font-semibold text-lg"></p>
        <button id="wlResetBtn" class="mt-5 text-sm text-hype font-semibold">Back to form</button>
      </div>

      <form id="wlForm" class="bg-surface border border-line rounded-2xl p-6 sm:p-8">
        <h2 id="wlHeadline" class="font-display text-2xl mb-2">SNEPLUS LIVE</h2>
        <p id="wlDesc" class="text-sm text-muted mb-6 leading-relaxed"></p>
        <div class="space-y-4">
          <div>
            <label id="lblName" class="text-xs font-semibold text-muted"></label>
            <input required id="wlName" type="text" class="w-full mt-1 rounded-xl px-3.5 py-2.5 text-sm" />
          </div>
          <div>
            <label id="lblEmail" class="text-xs font-semibold text-muted"></label>
            <input required id="wlEmail" type="email" class="w-full mt-1 rounded-xl px-3.5 py-2.5 text-sm" />
            <p id="wlEmailError" class="hidden text-xs text-hype mt-1"></p>
          </div>
          <div>
            <label id="lblCountry" class="text-xs font-semibold text-muted"></label>
            <div class="relative mt-1 wl-dd" id="wlCountryDropdown">
              <input type="hidden" id="wlCountryInput">
              <button type="button" id="wlCountryBtn" class="wl-dd-btn w-full rounded-xl px-3.5 py-2.5 text-sm bg-surface border border-line flex items-center justify-between gap-2 hover:border-white/30 transition" data-dd="wlCountry" aria-haspopup="listbox" aria-expanded="false">
                <span id="wlCountryLabel" class="text-muted">-</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="shrink-0 text-muted"><path d="M6 9l6 6 6-6"/></svg>
              </button>
              <div id="wlCountryMenu" class="wl-dd-menu hidden absolute z-20 mt-1 w-full rounded-xl border border-line bg-surface2 shadow-lg overflow-hidden max-h-56 overflow-y-auto"></div>
            </div>
          </div>
          <div>
            <label id="lblType" class="text-xs font-semibold text-muted"></label>
            <div class="relative mt-1 wl-dd" id="wlTypeDropdown">
              <input type="hidden" id="wlTypeInput" required>
              <button type="button" id="wlTypeBtn" class="wl-dd-btn w-full rounded-xl px-3.5 py-2.5 text-sm bg-surface border border-line flex items-center justify-between gap-2 hover:border-white/30 transition" data-dd="wlType" aria-haspopup="listbox" aria-expanded="false"
                class="w-full rounded-xl px-3.5 py-2.5 text-sm bg-surface border border-line flex items-center justify-between gap-2 hover:border-white/30 transition">
                <span id="wlTypeLabel" class="text-muted">-</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="shrink-0 text-muted"><path d="M6 9l6 6 6-6"/></svg>
              </button>
              <div id="wlTypeMenu" class="wl-dd-menu hidden absolute z-20 mt-1 w-full rounded-xl border border-line bg-surface2 shadow-lg overflow-hidden max-h-56 overflow-y-auto"></div>
            </div>
          </div>
          <div>
            <label id="lblCategory" class="text-xs font-semibold text-muted"></label>
            <div class="relative mt-1 wl-dd" id="wlCategoryDropdown">
              <input type="hidden" id="wlCategoryInput">
              <button type="button" id="wlCategoryBtn" class="wl-dd-btn w-full rounded-xl px-3.5 py-2.5 text-sm bg-surface border border-line flex items-center justify-between gap-2 hover:border-white/30 transition" data-dd="wlCategory" aria-haspopup="listbox" aria-expanded="false">
                <span id="wlCategoryLabel" class="text-muted">-</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="shrink-0 text-muted"><path d="M6 9l6 6 6-6"/></svg>
              </button>
              <div id="wlCategoryMenu" class="wl-dd-menu hidden absolute z-20 mt-1 w-full rounded-xl border border-line bg-surface2 shadow-lg overflow-hidden max-h-56 overflow-y-auto"></div>
            </div>
          </div>
        </div>
        <button id="wlSubmitBtn" type="submit" class="w-full mt-7 py-3 rounded-full bg-hype hover:bg-hypedark font-bold text-sm transition"></button>
      </form>
    </div>
  </section>
</main>


<div data-component="footer"></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/js/components.js"></script>
<script src="/js/utils/toast.js"></script>
<script src="/js/api/api.js"></script>
<script src="/js/api/auth.api.js"></script>
<script src="/js/api/waitlist.api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/waitlist/waitlist.js"></script>
</body>
</html>
